[package]
name = "movingai"
description = "MovingAI Benchmark Map/Scen File Parser"
version = "3.0.2"
authors = ["Davide Aversa <thek3nger@gmail.com>"]
keywords = ["pathfinding", "benchmark", "parser"]
categories = ["parsing", "science", "simulation"]
homepage = "https://github.com/THeK3nger/movingai-rust"
repository = "https://github.com/THeK3nger/movingai-rust"
readme = "README.md"
license = "MIT"
edition = "2024"

[badges]

maintenance = { status = "passively-maintained" }

[dependencies]
arrayvec = "0.7.8"
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
criterion = "0.8.2"

[[bench]]
name = "neighbors_bench"
harness = false

[[bench]]
name = "octree_bench"
harness = false
